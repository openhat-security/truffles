# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: truffles

before:
  hooks:
    - go mod tidy

builds:
  - id: truffles
    main: ./cmd/truffles
    binary: truffles
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/adamsiwiec/truffles/internal/version.Version={{.Version}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    formats: [binary]
    name_template: "truffles_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: SHA256SUMS.txt
  algorithm: sha256

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: openhat-security
    name: truffles
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"

nfpms:
  - id: packages
    ids:
      - truffles
    package_name: truffles
    file_name_template: "truffles_{{ .Version }}_{{ .Arch }}"
    homepage: https://github.com/adamsiwiec/truffles
    maintainer: Adam Siwiec <opensource@adamsiwiec.com>
    description: |-
      Find GitHub repositories at scale, then scan their full git history for leaked credentials with trufflehog.
    license: MIT
    section: utils
    priority: optional
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    contents:
      - src: LICENSE
        dst: /usr/share/doc/truffles/LICENSE
        type: doc
      - src: README.md
        dst: /usr/share/doc/truffles/README.md
        type: doc

snapshot:
  version_template: "{{ .Version }}-next"
