# Search locally, scan on remote GCE workers, pull results back.
# Host / user / key / workdir live in remote.env (gitignored).
#   cp remote.example.env remote.env
#
# Run (TTY prompts for data dir + scan name; -y skips prompts):
#   ./truffles playbook -f remote-playbook.yaml
#   ./truffles playbook -f remote-playbook.yaml -y -data-dir data -out remote-results
#
# Cluster-only (omit -f to run search into <data_dir>/<scan_name>/repos.txt):
#   ./truffles cluster status  -c remote-playbook.yaml
#   ./truffles cluster run     -c remote-playbook.yaml -w 4 -format csv
#   ./truffles cluster collect -c remote-playbook.yaml
#
# Manage VMs:
#   ./scripts/manage-gce-workers.sh <PROJECT> suggest|list|create|resize|…
# If a worker OOMs / SSH dies, playbook/cluster run auto-heals when gce_* is set
# (stop remote → gcloud reset → wait SSH → deploy). Manual:
#   ./truffles cluster heal -c remote-playbook.yaml

# Required — playbook label (used in logs / result filenames)
name: remote
# Not required — optional description
description: search locally, scan on remote GCE workers
# Not required — defaults to current user@hostname if empty
master: localhost
# Not required — optional dotenv for ${VAR} expansion (path relative to this YAML)
env_file: remote.env
# Not required — default true when any slave has gce_instance. false disables auto reset/deploy.
auto_heal: true

# Not required — parent directory for run output (default: data). TTY will ask.
data_dir: data
# Not required — scan name under data_dir/ (default: remote-results).
# If data/remote-results exists, uses -1, -2, -3, … instead of overwriting.
# Each run dir gets repos.txt; during remote scan also scan-worker*.log (tail -f) and
# refreshing results-worker*.csv/.txt; after collect, combined results.csv + performance.json.
collect_out: remote-results

# --- Scan profiles (pick one mindset; mix carefully) ---
#
# Fast scan (remote GCE workers — recommended for this playbook):
#   search.no_proxy: false + search.tokens → spread GitHub *API* page fetches across
#     proxy IPs; search.workers: 8–16 if the pool is warm.
#   scan.no_proxy: true on each slave → git clone uses the VM's own IP (datacenter
#     bandwidth, no free-proxy flakiness). Cluster run shuffles repos before split
#     so heavy clones are not all on one worker.
#   scan.workers: 4–6 per e2-standard-2 (8GB); 2 slaves × 6 → 12 parallel clones.
#   scan.tokens: same PAT(s) as search → higher anonymous-git limits per token/IP.
#   skip_file + append_scanned for incremental re-runs.
#   Optional speed: max_depth: 50–200 (less history), no_verification: true (secrets
#     only, no live checks — much faster trufflehog phase after clone).
#
# Proxy spread (single machine or when GitHub throttles clone by IP):
#   search.no_proxy: false (as above).
#   scan.no_proxy: false → each trufflehog child gets HTTPS_PROXY from the pool;
#     spreads clone traffic across many IPs but free proxies are slow/unreliable for
#     large packfiles; pool size ~30, use_direct: true keeps VM IP as fallback.
#   Prefer more GCE slaves with scan.no_proxy: true over proxy clones when possible.
#
# Bottleneck reality: wall time is usually git clone + pack download (full history),
# not trufflehog CPU. 1000 JS repos × full history can be many hours even at 8–12
# parallel clones — there is no magic YAML knob for that.

search:
  # Not required — optional owner (user/org). Omit for global GitHub search.
  # At least one of owner, queries, or prefix_file must be set.
  # Active mode: prefix_file (API key prefix code search). Optional queries below widen discovery.
  # owner: adamsiwiec1
  # queries:
  #   - "**claude**"
  #   - "**genai**"
  # Not required — file of API key prefixes (one per line); each runs GitHub *code*
  # search as `"<prefix>" in:file`, repos deduped, then scan runs trufflehog.
  # Broader verified list: examples/prefixes.txt (ghp_, sk-proj-, pcsk_, AKIA, xoxb-, …).
  # OpenAI-focused: examples/prefixes-openai.txt — or examples/prefixes.txt for all providers
  prefix_file: examples/prefixes.txt
  # Max *new* repos to discover (already-scanned via scan.skip_file are not counted).
  # 1000 new repos ≈ hours of full-history scan on 2× e2-standard-2.
  limit: 1000
  # Not required — basename for the repo URL list under <data_dir>/<scan>/ (default: repos.txt)
  out: repos.txt
  # Not required — optional concurrent page fetches (default: 8)
  workers: 8
  # false = proxy pool for search HTTP (helps API rate limits). true = this host only.
  no_proxy: false
  # Required for prefix_file / GitHub *code* search (unauthenticated → 401).
  # Values expand via env_file (remote.env) or the process env. Use token
  # (single or comma-separated) and/or tokens (YAML list). Search round-robins
  # tokens with proxy rotation. repo search also needs this for a useful quota.
  tokens:
    - ${GITHUB_TOKEN}
    - ${GITHUB_TOKEN_2}

scan:
  # Not required — basename under <data_dir>/<scan>/; filled after search
  file: repos.txt
  # Default -workers when a slave omits workers:. Per-slave workers: overrides
  # this and also weights how many repos that slave gets (capacity-weighted split).
  workers: 6
  # Not required — optional report format: pretty | csv | jsonl
  # On disk, pretty (.txt) and csv are both written (and both collected from workers).
  format: csv
  # Not required — heartbeat interval on workers (e.g. 15s); also sets CSV mirror pull interval.
  # progress: 15s
  # true/nil = direct git clone on the worker (fast scan profile). false = proxy pool
  # on the worker (proxy spread profile; see header above).
  no_proxy: true
  # Not required — PAT(s) for git clone. Comma-separated token or tokens list;
  # embedded in clone URL (trufflehog git has no --token flag).
  tokens:
    - ${GITHUB_TOKEN}
    - ${GITHUB_TOKEN_2}
  # Not required — optional master list of already-scanned repo URLs (skipped on later runs)
  skip_file: data/scanned-repos.txt
  # Not required — optional; append successfully scanned URLs here (often same as skip_file)
  append_scanned: data/scanned-repos.txt
  # Repos scanned with zero verified secrets (one URL/line; skip on later search/scan).
  # Updated only when no_verification is false. Rebuild: truffles clean rebuild --include-scanned
  clean_file: data/clean-repos.txt
  # Not required — globs skipped at git-log level (faster; fewer fixture/docs hits)
  exclude_paths:
    - node_modules
    - vendor
    - dist
    - build
    - "*.lock"
    - "*.min.js"
    - "**/testdata/**"
    - "**/fixtures/**"
  # Scan window after a full clone (default 2y). Examples: 2y, 6m, 90d, 2024-01-01, all
  # Full history is always cloned; -since only limits which commits trufflehog scans.
  since: 2y
  # Live verification: call provider APIs so verified secrets stand out for disclose.
  # false = verify (recommended for disclosure). true = faster but all unverified.
  no_verification: false

# Not required — omit slaves entirely to scan locally instead of over SSH.
# When present, search runs here; scan runs on each enabled slave (in parallel).
# Mixed fleet: 2× e2-standard-2 (workers 6) + 5× e2-small (workers 2).
# Capacity-weighted split: big boxes get ~3× the repo share of small ones.
slaves:
  - name: worker1
    host: ${TRUFFLES_WORKER1_HOST}
    user: ${TRUFFLES_WORKER1_USER}
    port: 22
    key: ${TRUFFLES_WORKER1_KEY}
    workdir: ${TRUFFLES_WORKER1_WORKDIR}
    truffles_path: ${TRUFFLES_WORKER1_BIN}
    gce_instance: ${TRUFFLES_WORKER1_GCE_INSTANCE}
    gce_zone: ${TRUFFLES_WORKER1_GCE_ZONE}
    gce_project: ${TRUFFLES_WORKER1_GCE_PROJECT}
    workers: 6 # e2-standard-2 (~8GB)
    enabled: true

  - name: worker2
    host: ${TRUFFLES_WORKER2_HOST}
    user: ${TRUFFLES_WORKER2_USER}
    port: 22
    key: ${TRUFFLES_WORKER2_KEY}
    workdir: ${TRUFFLES_WORKER2_WORKDIR}
    truffles_path: ${TRUFFLES_WORKER2_BIN}
    gce_instance: ${TRUFFLES_WORKER2_GCE_INSTANCE}
    gce_zone: ${TRUFFLES_WORKER2_GCE_ZONE}
    gce_project: ${TRUFFLES_WORKER2_GCE_PROJECT}
    workers: 6 # e2-standard-2 (~8GB)
    enabled: true

  - name: worker3
    host: ${TRUFFLES_WORKER3_HOST}
    user: ${TRUFFLES_WORKER3_USER}
    port: 22
    key: ${TRUFFLES_WORKER3_KEY}
    workdir: ${TRUFFLES_WORKER3_WORKDIR}
    truffles_path: ${TRUFFLES_WORKER3_BIN}
    gce_instance: ${TRUFFLES_WORKER3_GCE_INSTANCE}
    gce_zone: ${TRUFFLES_WORKER3_GCE_ZONE}
    gce_project: ${TRUFFLES_WORKER3_GCE_PROJECT}
    workers: 2 # e2-small (~2GB)
    enabled: true

  - name: worker4
    host: ${TRUFFLES_WORKER4_HOST}
    user: ${TRUFFLES_WORKER4_USER}
    port: 22
    key: ${TRUFFLES_WORKER4_KEY}
    workdir: ${TRUFFLES_WORKER4_WORKDIR}
    truffles_path: ${TRUFFLES_WORKER4_BIN}
    gce_instance: ${TRUFFLES_WORKER4_GCE_INSTANCE}
    gce_zone: ${TRUFFLES_WORKER4_GCE_ZONE}
    gce_project: ${TRUFFLES_WORKER4_GCE_PROJECT}
    workers: 2
    enabled: true

  - name: worker5
    host: ${TRUFFLES_WORKER5_HOST}
    user: ${TRUFFLES_WORKER5_USER}
    port: 22
    key: ${TRUFFLES_WORKER5_KEY}
    workdir: ${TRUFFLES_WORKER5_WORKDIR}
    truffles_path: ${TRUFFLES_WORKER5_BIN}
    gce_instance: ${TRUFFLES_WORKER5_GCE_INSTANCE}
    gce_zone: ${TRUFFLES_WORKER5_GCE_ZONE}
    gce_project: ${TRUFFLES_WORKER5_GCE_PROJECT}
    workers: 2
    enabled: true

  - name: worker6
    host: ${TRUFFLES_WORKER6_HOST}
    user: ${TRUFFLES_WORKER6_USER}
    port: 22
    key: ${TRUFFLES_WORKER6_KEY}
    workdir: ${TRUFFLES_WORKER6_WORKDIR}
    truffles_path: ${TRUFFLES_WORKER6_BIN}
    gce_instance: ${TRUFFLES_WORKER6_GCE_INSTANCE}
    gce_zone: ${TRUFFLES_WORKER6_GCE_ZONE}
    gce_project: ${TRUFFLES_WORKER6_GCE_PROJECT}
    workers: 2
    enabled: true

  - name: worker7
    host: ${TRUFFLES_WORKER7_HOST}
    user: ${TRUFFLES_WORKER7_USER}
    port: 22
    key: ${TRUFFLES_WORKER7_KEY}
    workdir: ${TRUFFLES_WORKER7_WORKDIR}
    truffles_path: ${TRUFFLES_WORKER7_BIN}
    gce_instance: ${TRUFFLES_WORKER7_GCE_INSTANCE}
    gce_zone: ${TRUFFLES_WORKER7_GCE_ZONE}
    gce_project: ${TRUFFLES_WORKER7_GCE_PROJECT}
    workers: 2 # us-east1-b (us-central1 IN_USE_ADDRESSES quota is 8)
    enabled: true
