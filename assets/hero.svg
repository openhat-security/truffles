<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">truffles — Find repos at scale. Scan every commit. Catch leaked secrets.</title>
  <desc id="desc">Hero art for truffles: search GitHub at scale, scan history with trufflehog, run playbooks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.2" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <linearGradient id="termTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1080" cy="80" r="220" fill="url(#glow)" filter="url(#soft)"/>
  <circle cx="160" cy="560" r="180" fill="#fb923c" opacity="0.08" filter="url(#soft)"/>

  <text x="72" y="88" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="26" font-weight="700" letter-spacing="4" fill="#fdba74">TRUFFLES</text>
  <text x="72" y="148" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="40" font-weight="700" fill="#f8fafc">Find repos at scale.</text>
  <text x="72" y="200" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="40" font-weight="700" fill="#f8fafc">Scan every commit.</text>
  <text x="72" y="252" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="40" font-weight="700" fill="#f8fafc">Catch leaked secrets.</text>
  <text x="72" y="298" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" fill="#fed7aa">GitHub enumeration + trufflehog history scans, in one CLI.</text>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16">
    <text x="72" y="340" fill="#fdba74" font-weight="700">1</text>
    <text x="96" y="340" fill="#94a3b8">Enumerate orgs / global search</text>
    <text x="72" y="368" fill="#fdba74" font-weight="700">2</text>
    <text x="96" y="368" fill="#94a3b8">Filter with globs or regex</text>
    <text x="72" y="396" fill="#fdba74" font-weight="700">3</text>
    <text x="96" y="396" fill="#94a3b8">Scan full git history with trufflehog</text>
  </g>

  <text x="72" y="438" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#64748b">WORKS WITH</text>
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="600">
    <rect x="72" y="452" rx="10" ry="10" width="122" height="40" fill="#172554" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="94" cy="472" r="8" fill="#38bdf8"/>
    <text x="110" y="477" fill="#bae6fd">GitHub</text>
    <rect x="204" y="452" rx="10" ry="10" width="148" height="40" fill="#431407" stroke="#fb923c" stroke-width="1"/>
    <rect x="218" y="464" width="12" height="16" rx="2" fill="#fb923c"/>
    <text x="236" y="477" fill="#fed7aa">trufflehog</text>
    <rect x="362" y="452" rx="10" ry="10" width="132" height="40" fill="#042f2e" stroke="#2dd4bf" stroke-width="1"/>
    <rect x="376" y="464" width="16" height="16" rx="3" fill="none" stroke="#5eead4" stroke-width="1.8"/>
    <text x="400" y="477" fill="#99f6e4">playbooks</text>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="600">
    <rect x="72" y="508" rx="999" ry="999" width="86" height="28" fill="#7c2d12"/>
    <text x="115" y="527" text-anchor="middle" fill="#fed7aa">search</text>
    <rect x="168" y="508" rx="999" ry="999" width="70" height="28" fill="#1e3a5f"/>
    <text x="203" y="527" text-anchor="middle" fill="#bae6fd">scan</text>
    <rect x="248" y="508" rx="999" ry="999" width="88" height="28" fill="#312e81"/>
    <text x="292" y="527" text-anchor="middle" fill="#c7d2fe">cluster</text>
    <rect x="346" y="508" rx="999" ry="999" width="86" height="28" fill="#164e63"/>
    <text x="389" y="527" text-anchor="middle" fill="#a5f3fc">proxies</text>
  </g>

  <g transform="translate(640,48)">
    <rect width="568" height="544" rx="16" ry="16" fill="#020617" stroke="#334155" stroke-width="1.5"/>
    <rect width="568" height="44" rx="16" ry="16" fill="url(#termTop)"/>
    <rect y="28" width="568" height="16" fill="url(#termTop)"/>
    <circle cx="28" cy="22" r="6" fill="#f87171"/>
    <circle cx="50" cy="22" r="6" fill="#fbbf24"/>
    <circle cx="72" cy="22" r="6" fill="#34d399"/>
    <text x="284" y="27" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#64748b">truffles</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#e2e8f0">
      <text x="28" y="78" fill="#fb923c" xml:space="preserve"> _____ ____  _   _ _____ _____ _     _____ ____</text>
      <text x="28" y="96" fill="#fb923c" xml:space="preserve">|_   _|  _ \| | | |  ___|  ___| |   | ____/ ___|</text>
      <text x="28" y="114" fill="#fb923c" xml:space="preserve">  | | | |_) | | | | |_  | |_  | |   |  _| \___ \</text>
      <text x="28" y="132" fill="#fb923c" xml:space="preserve">  | | |  _ &lt;| |_| |  _| |  _| | |___| |___ ___) |</text>
      <text x="28" y="150" fill="#fb923c" xml:space="preserve">  |_| |_| \_\___/|_|   |_|   |_____|_____|____/</text>

      <text x="28" y="186"><tspan fill="#f8fafc" font-weight="700">truffles</tspan><tspan fill="#94a3b8"> — find · filter · scan for secrets</tspan></text>

      <text x="28" y="222" fill="#64748b">Usage:</text>
      <text x="28" y="244" xml:space="preserve">  truffles &lt;command&gt; [flags]</text>

      <text x="28" y="280" fill="#fdba74" font-weight="700">search</text>
      <text x="28" y="302" xml:space="preserve">  search    owner / glob / regex / global</text>

      <text x="28" y="338" fill="#fdba74" font-weight="700">scan</text>
      <text x="28" y="360" xml:space="preserve">  scan      trufflehog full-history</text>

      <text x="28" y="396" fill="#fdba74" font-weight="700">playbook</text>
      <text x="28" y="418" xml:space="preserve">  playbook  YAML search then scan</text>

      <text x="28" y="460" fill="#64748b">$</text>
      <text x="44" y="460" fill="#e2e8f0">truffles search -owner openhat-security '*run*'</text>
      <rect x="500" y="448" width="8" height="16" fill="#fb923c"/>
    </g>
  </g>
</svg>
